services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      BASE_MODEL: qwen2.5-coder:7b
      EMBED_MODEL: nomic-embed-text
      JUDGE_MODEL: llama3.1:8b
    volumes:
      - ./pull_models.sh:/pull_models.sh:ro
    entrypoint: ["/bin/sh", "/pull_models.sh"]
    restart: "no"

  streamlit:
    build: .
    environment:
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8501:8501"
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_data:
