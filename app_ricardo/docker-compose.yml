services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELFILES_DIR: /Modelfiles
    volumes:
      - ./Modelfiles:/Modelfiles:ro
      - ./create_models.sh:/create_models.sh:ro
    entrypoint: ["/bin/sh", "/create_models.sh"]
    restart: "no"

  api:
    build: .
    command: ["fastapi", "run", "api.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      OLLAMA_API_URL: http://ollama:11434/api/chat
    ports:
      - "8000:8000"
    volumes:
      - ./autodoc:/app/autodoc
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  streamlit:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000/generate
    ports:
      - "8501:8501"
    volumes:
      - ./autodoc:/app/autodoc
    depends_on:
      - api

volumes:
  ollama_data:
